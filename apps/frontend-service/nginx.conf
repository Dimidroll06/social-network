server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /swagger/openapi.json {
    proxy_pass http://auth-service:4001/openapi.json;
    include /etc/nginx/proxy_params;
  }

  # The browser talks only to nginx. Backend services stay behind this gateway.
  location /api/auth/ {
    proxy_pass http://auth-service:4001;
    include /etc/nginx/proxy_params;
  }

  location /api/user/ {
    proxy_pass http://user-service:4002;
    include /etc/nginx/proxy_params;
  }

  location /api/feed/ {
    proxy_pass http://feed-service:4003;
    include /etc/nginx/proxy_params;
  }

  # Reserved for the future OpenAPI UI and its generated specification.
  location = /swagger {
    return 308 /swagger/;
  }

  location ^~ /swagger/ {
    try_files $uri $uri/ =404;
  }

  # Do not send unknown API paths to the SPA fallback.
  location ^~ /api/ {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
