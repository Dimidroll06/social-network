services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  auth-migrate:
    build:
      context: ./apps/auth-service
      dockerfile: Dockerfile.migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/auth_db?schema=public&connection_limit=5
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  user-migrate:
    build:
      context: ./apps/user-service
      dockerfile: Dockerfile.migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/user_db?schema=public&connection_limit=5
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  feed-migrate:
    build:
      context: ./apps/feed-service
      dockerfile: Dockerfile.migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/feed_db?schema=public&connection_limit=5
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/auth_db?schema=public&connection_limit=5
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-604800}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      AUTH_SERVICE_URL: http://auth-service:4001
      USER_SERVICE_URL: http://user-service:4002
      FEED_SERVICE_URL: http://feed-service:4003
    ports:
      - "${AUTH_PORT:-4001}:4001"
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:4001/api/auth/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]

  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4002
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/user_db?schema=public&connection_limit=5
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      AUTH_SERVICE_URL: http://auth-service:4001
      USER_SERVICE_URL: http://user-service:4002
      FEED_SERVICE_URL: http://feed-service:4003
    ports:
      - "${USER_PORT:-4002}:4002"
    depends_on:
      user-migrate:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:4002/api/user/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]

  feed-service:
    build:
      context: .
      dockerfile: apps/feed-service/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4003
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/feed_db?schema=public&connection_limit=5
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      AUTH_SERVICE_URL: http://auth-service:4001
      USER_SERVICE_URL: http://user-service:4002
      FEED_SERVICE_URL: http://feed-service:4003
    ports:
      - "${FEED_PORT:-4003}:4003"
    depends_on:
      feed-migrate:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:4003/api/feed/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]

  frontend-service:
    build:
      context: .
      dockerfile: apps/frontend-service/Dockerfile
      args:
        VITE_AUTH_SERVICE_URL: ${VITE_AUTH_SERVICE_URL:-http://localhost:4001}
        VITE_USER_SERVICE_URL: ${VITE_USER_SERVICE_URL:-http://localhost:4002}
        VITE_FEED_SERVICE_URL: ${VITE_FEED_SERVICE_URL:-http://localhost:4003}
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      feed-service:
        condition: service_healthy
    networks: [backend]

volumes:
  db_data:

networks:
  backend:
    driver: bridge
