services:
  users-service:
    build:
      context: ../..
      dockerfile: Dockerfile.nest
      args:
        - SERVICE_NAME=users-service
    restart: unless-stopped
    depends_on:
      users-db:
        condition: service_healthy
      users-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${USERS_DB_USER}:${USERS_DB_PASSWORD}@users-db:5432/users
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    networks:
      - backend
  posts-service:
    build:
      context: ../..
      dockerfile: Dockerfile.nest
      args:
        - SERVICE_NAME=posts-service
    depends_on:
      posts-db:
        condition: service_healthy
      posts-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTS_DB_USER}:${POSTS_DB_PASSWORD}@posts-db:5432/posts
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    networks:
      - backend
  api-gateway:
    build:
      context: ../..
      dockerfile: Dockerfile.nest
      args:
        - SERVICE_NAME=api-gateway
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    networks:
      - backend
      - frontend
