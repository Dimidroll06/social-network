services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-migrate:
    build:
      context: ./apps/auth-service
      dockerfile: Dockerfile.migrate
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/auth_db?schema=public&connection_limit=5"
    depends_on:
      db:
        condition: service_healthy

  user-migrate:
    build:
      context: ./apps/user-service
      dockerfile: Dockerfile.migrate
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/user_db?schema=public&connection_limit=5"
    depends_on:
      db:
        condition: service_healthy

  feed-migrate:
    build:
      context: ./apps/feed-service
      dockerfile: Dockerfile.migrate
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/feed_db?schema=public&connection_limit=5"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
