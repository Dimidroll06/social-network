services:
  posts-db:
    image: postgres:19.0-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTS_DB_USER}
      - POSTGRES_PASSWORD=${POSTS_DB_PASSWORD}
      - POSTGRES_DB=posts
    volumes:
      - posts-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d posts"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - backend
  users-db:
    image: postgres:19.0-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${USERS_DB_USER}
      - POSTGRES_PASSWORD=${USERS_DB_PASSWORD}
      - POSTGRES_DB=users
    volumes:
      - users-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d users"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - backend
  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend
volumes:
  users-data:
    driver: local
  posts-data:
    driver: local
  rabbitmq-data:
    driver: local
